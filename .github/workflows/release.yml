name: release

# Every push to main publishes a snapshot pre-release `v<last tag or 0.0.0>-snapshot.<run number>` (only the latest is kept);
# running it by hand (Actions > release > Run workflow, on main) with a patch/minor/major bump publishes the release
# `vX.Y.Z` that is kept; the tag is created by the publication itself. It doesn't wait for the `app`/`engine` workflows: the clean-install
# check below gates the publication, and a later push replaces a bad snapshot.
# The `apt` job then republishes the signed apt repository on GitHub Pages: suite `stable` holds the latest release,
# suite `snapshot` the latest snapshot.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }} # a newer snapshot supersedes this one, a release is never cancelled

env:
  UV_VERSION: 0.12.21 # the uv bundled as the app's sidecar, also used to build the madmom wheel

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::releases are made from main, not $GITHUB_REF"
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) version=$((major + 1)).0.0 ;;
              minor) version=$major.$((minor + 1)).0 ;;
              patch) version=$major.$minor.$((patch + 1)) ;;
            esac
          else
            version=${last#v}-snapshot.$GITHUB_RUN_NUMBER
          fi
          if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-snapshot\.[0-9]+)?$'; then
            echo "::error::not a semver version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One job per platform; a macOS job (M6-3) would build its .dmg the same way and upload a `macos` artifact.
  linux:
    needs: version
    runs-on: ubuntu-22.04 # the oldest glibc the deb and the AppImage then run on
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag upstream
        with:
          version: ${{ env.UV_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # Tauri's packages (https://v2.tauri.app/start/prerequisites/#linux), patchelf for the AppImage, and the GStreamer
      # plugins the AppImage bundles (bundleMediaFramework).
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: Build the madmom wheel (first launch then needs no git nor C compiler)
        run: |
          rev=$(sed -n 's/^madmom = .*rev = "\([0-9a-f]*\)".*/\1/p' engine/pyproject.toml)
          git clone --quiet https://github.com/CPJKU/madmom "$RUNNER_TEMP/madmom"
          git -C "$RUNNER_TEMP/madmom" checkout --quiet "$rev"
          git -C "$RUNNER_TEMP/madmom" submodule update --init --quiet # the model weights
          uv build --wheel --python 3.11 --out-dir engine/wheels "$RUNNER_TEMP/madmom"
      - name: Download the uv sidecar
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p app/src-tauri/binaries
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-$triple.tar.gz" |
            tar -xzO "uv-$triple/uv" > "app/src-tauri/binaries/madsister-uv-$triple"
          chmod +x "app/src-tauri/binaries/madsister-uv-$triple"
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Build the deb and the AppImage
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >-
          pnpm tauri build --bundles deb,appimage --config src-tauri/tauri.bundle.conf.json
          --config "{\"version\":\"$VERSION\",\"bundle\":{\"resources\":{\"../../engine/wheels/\":\"engine/wheels/\"}}}"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage

  # M6 "done when" on Linux: the deb installs on a clean system and its engine sets up and transcribes, with no compiler.
  linux-clean-install:
    needs: [version, linux]
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # setup-engine.sh, the script the app runs on first launch
      - uses: actions/download-artifact@v8
        with:
          name: linux
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./deb/madsister_*.deb
      - name: Set up the engine as a user, then transcribe a synthetic C major clip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          useradd --create-home user
          cp app/src-tauri/setup-engine.sh /tmp/ # readable by the user
          project=$(dirname "$(dpkg -L madsister | grep '/engine/pyproject.toml$')")
          su user -c "sh -eu" <<EOF
          cd
          env=\$HOME/.local/share/dev.dericbourg.madsister/engine-env
          start=\$(date +%s)
          sh /tmp/setup-engine.sh /usr/bin/madsister-uv $project "\$env" $VERSION
          echo "setup: \$((\$(date +%s) - start)) s, env: \$(du -sh "\$env" | cut -f1)"
          ffmpeg -loglevel error -f lavfi -i "aevalsrc='0.3*(sin(2*PI*261.63*t)+sin(2*PI*329.63*t)+sin(2*PI*392*t))*exp(-6*mod(t,0.5))':s=44100:d=12" c.wav
          start=\$(date +%s)
          "\$env/bin/madsister-engine" transcribe c.wav --out c.madsister.json
          echo "transcribe: \$((\$(date +%s) - start)) s"
          grep -q '"chord": "C:maj"' c.madsister.json
          EOF

  publish:
    needs: [version, linux, linux-clean-install]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          notes="For non-commercial use only: the engine includes madmom's CC BY-NC-SA 4.0 model weights (see THIRD_PARTY.md).
          Linux: \`sudo apt install ./madsister_${VERSION}_amd64.deb\`, or the AppImage (it needs ffmpeg and libportaudio2).
          To get updates through apt (use \`Suites: snapshot\` for the snapshots):
          \`\`\`
          sudo curl -fsSLo /etc/apt/keyrings/madsister.asc https://${GH_REPO%%/*}.github.io/${GH_REPO##*/}/key.asc
          printf 'Types: deb\nURIs: https://${GH_REPO%%/*}.github.io/${GH_REPO##*/}\nSuites: stable\nComponents: main\nSigned-By: /etc/apt/keyrings/madsister.asc\n' | sudo tee /etc/apt/sources.list.d/madsister.sources
          sudo apt update && sudo apt install madsister
          \`\`\`
          The first launch downloads the engine (Python, its libraries and the models), once."
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Creates the tag on this commit (a tag pushed with the workflow's token wouldn't trigger anything anyway).
            gh release create "v$VERSION" dist/*/* --target "$GITHUB_SHA" --title "madsister $VERSION" --notes "$notes"
          else
            tag=v$VERSION
            gh release create "$tag" dist/*/* --prerelease --target "$GITHUB_SHA" --title "madsister $VERSION" --notes "$notes"
            # Only the latest snapshot is kept: the previous ones go once this one is published.
            gh release list --limit 100 --json tagName --jq '.[].tagName | select(contains("-snapshot."))' |
              while read -r old; do
                if [ "$old" != "$tag" ]; then gh release delete "$old" --cleanup-tag --yes; fi
              done
          fi

  # Rebuilds the whole site each time (a Pages deployment replaces it): both suites from the releases, so no deb enters git.
  apt:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false # a deployment is never cancelled midway
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Build the repository
        run: |
          gpg --batch --import <<< "$GPG_KEY"
          mkdir -p site && cd site
          release=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          snapshot=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(contains("-snapshot."))][0] // empty')
          for suite in stable snapshot; do
            mkdir -p "pool/$suite" "dists/$suite/main/binary-amd64"
            tag=$release; if [ "$suite" = snapshot ]; then tag=$snapshot; fi
            if [ -n "$tag" ]; then gh release download "$tag" --pattern '*.deb' --dir "pool/$suite"; fi
            apt-ftparchive packages "pool/$suite" > "dists/$suite/main/binary-amd64/Packages"
            apt-ftparchive -o "APT::FTPArchive::Release::Suite=$suite" -o "APT::FTPArchive::Release::Codename=$suite" \
              -o APT::FTPArchive::Release::Components=main -o APT::FTPArchive::Release::Architectures=amd64 \
              release "dists/$suite" > "dists/$suite/Release"
            gpg --batch --yes --clearsign -o "dists/$suite/InRelease" "dists/$suite/Release"
          done
          gpg --export --armor > key.asc
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
