name: release

# Every night, if main got a commit in the last 25 hours, publishes a snapshot pre-release `v<last tag or 0.0.0>-snapshot.<run number>` (only the latest is kept);
# running it by hand (Actions > release > Run workflow, on main) with a patch/minor/major bump publishes the release
# `vX.Y.Z` that is kept; the tag is created by the publication itself. With the `snapshot` bump, a manual run publishes
# a snapshot on demand, the same as the nightly one. It doesn't wait for the `app`/`engine` workflows: the clean-install
# check below gates the publication, and the next nightly snapshot replaces a bad one.
# A release is the package `madsister`, a snapshot the package `madsister-snapshot` (own binary, files and data dir: both
# can be installed together). The `apt` job then republishes the signed apt repository on GitHub Pages: its only suite
# holds the latest of each, and the `homebrew` job commits the matching macOS cask to adericbourg/homebrew-tap. Windows
# gets an installer on the release page only.
# A manual run can be limited to one platform: the release then only holds its files, and the other platforms' apt
# repository or cask keeps pointing at its previous release.
on:
  schedule:
    - cron: "0 3 * * *"  # macOS runners bill ~10x Linux: a snapshot per push burned the Actions quota
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump (snapshot: a pre-release, no bump)"
        required: true
        type: choice
        options: [patch, minor, major, snapshot]
        default: minor
      platforms:
        description: Platforms to build and publish
        required: true
        type: choice
        options: [all, linux, macos, windows]
        default: all

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # a snapshot or a release is never cancelled midway

env:
  UV_VERSION: 0.12.21 # the uv bundled as the app's sidecar, also used to build the madmom wheel
  FFMPEG_BUILD: autobuild-2026-10-19-13-06/ffmpeg-n8.1.3-18-g46d899d7a0-win64-gpl-8.1.zip # bundled in the Windows installer
  FFMPEG_SHA256: 5dc774c80fca5b63803ce052cbb1c7fc82aaccf3908b32e34f8842b367573c37
  PACKAGER_VERSION: 0.11.8 # cargo-packager, which builds the deb, AppImage, dmg and installer

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      package: ${{ steps.version.outputs.package }}
      skip: ${{ steps.version.outputs.skip }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          package=madsister-snapshot
          skip=false
          release=false
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -z "$(git log --since='25 hours ago' -1 --format=%H)" ]; then
            skip=true # nothing new on main since the last nightly
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$BUMP" != snapshot ]; then
            release=true
            package=madsister
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::releases are made from main, not $GITHUB_REF"
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) version=$((major + 1)).0.0 ;;
              minor) version=$major.$((minor + 1)).0 ;;
              patch) version=$major.$minor.$((patch + 1)) ;;
            esac
          else
            version=${last#v}-snapshot.$GITHUB_RUN_NUMBER
          fi
          if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-snapshot\.[0-9]+)?$'; then
            echo "::error::not a semver version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # One job per platform, each uploading its artifact (`linux`, `macos`, `windows`) to `publish`.
  linux:
    needs: version
    if: needs.version.outputs.skip != 'true' && inputs.platforms != 'macos' && inputs.platforms != 'windows' # the jobs that need this one are skipped with it
    runs-on: ubuntu-26.04 # the oldest glibc the deb and the AppImage then run on
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1 # no floating major tag upstream
        with:
          version: ${{ env.UV_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      # Slint's winit backend: fonts and keyboard layouts; cpal: ALSA (as in app.yml).
      # Plain apt-get: cache-apt-pkgs-action swallowed a mirror 404 and cached an empty package set.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libasound2-dev
      - run: cargo install cargo-packager --locked --version "$PACKAGER_VERSION"
      - uses: actions/cache@v6 # the AppImage tools (linuxdeploy, AppRun, its plugins) cargo-packager downloads otherwise
        with:
          path: ~/.cache/.cargo-packager
          key: cargo-packager-tools-${{ runner.os }}-${{ env.PACKAGER_VERSION }}
      - id: madmom
        run: echo "rev=$(sed -n 's/^madmom = .*rev = "\([0-9a-f]*\)".*/\1/p' engine/pyproject.toml)" >> "$GITHUB_OUTPUT"
      - id: madmom-wheel
        uses: actions/cache@v6
        with:
          path: engine/wheels
          key: madmom-wheel-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ steps.madmom.outputs.rev }}
      - name: Build the madmom wheel (first launch then needs no git nor C compiler)
        if: steps.madmom-wheel.outputs.cache-hit != 'true'
        env:
          rev: ${{ steps.madmom.outputs.rev }}
        run: |
          git clone --quiet https://github.com/CPJKU/madmom "$RUNNER_TEMP/madmom"
          git -C "$RUNNER_TEMP/madmom" checkout --quiet "$rev"
          git -C "$RUNNER_TEMP/madmom" submodule update --init --quiet # the model weights
          uv build --wheel --python 3.11 --out-dir engine/wheels "$RUNNER_TEMP/madmom"
      - name: Download the uv sidecar
        env:
          PACKAGE: ${{ needs.version.outputs.package }}
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p app/binaries
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-$triple.tar.gz" |
            tar -xzO "uv-$triple/uv" > "app/binaries/$PACKAGE-uv-$triple"
          chmod +x "app/binaries/$PACKAGE-uv-$triple"
      - name: Build the deb and the AppImage
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE: ${{ needs.version.outputs.package }}
          APPIMAGE_EXTRACT_AND_RUN: 1 # linuxdeploy is an AppImage too, and the runner may have no FUSE to mount it
        # The version is the crate's (the app stamps the engine env with it); the binary is named after the package (deb,
        # resources, desktop file, data dir: see release-config.py).
        run: |
          perl -0pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/m' Cargo.toml
          cargo build --release
          [ "$PACKAGE" = madsister ] || cp target/release/madsister "target/release/$PACKAGE"
          cargo packager -c "$(uv run --no-project --python 3.11 release-config.py "$PACKAGE" "$VERSION")" -f deb,appimage
          mv "target/release/${PACKAGE}_${VERSION}_x86_64.AppImage" "target/release/${PACKAGE}_${VERSION}_amd64.AppImage" # the deb's arch name, as before
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: |
            app/target/release/*.deb
            app/target/release/*.AppImage

  # M6 "done when" on Linux: the deb installs on a clean system and its engine sets up and transcribes, with no compiler.
  linux-clean-install:
    needs: [version, linux]
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # setup-engine.py, the script the app runs on first launch
      - uses: actions/download-artifact@v8
        with:
          name: linux
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./*.deb
      - name: The deb's dependencies bring every library the app links to
        env:
          PACKAGE: ${{ needs.version.outputs.package }}
        run: |
          ldd "/usr/bin/$PACKAGE"
          ! ldd "/usr/bin/$PACKAGE" | grep 'not found'
      - name: Set up the engine as a user, then transcribe a synthetic C major clip
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE: ${{ needs.version.outputs.package }}
        run: |
          useradd --create-home user
          cp app/setup-engine.py /tmp/ # readable by the user
          project=$(dirname "$(dpkg -L "$PACKAGE" | grep '/engine/pyproject.toml$')")
          su user -c "sh -eu" <<EOF
          cd
          env=\$HOME/.local/share/dev.dericbourg.$PACKAGE/engine-env
          start=\$(date +%s)
          /usr/bin/$PACKAGE-uv run --no-project --managed-python --python 3.11 python -I /tmp/setup-engine.py /usr/bin/$PACKAGE-uv $project "\$env" $VERSION
          echo "setup: \$((\$(date +%s) - start)) s, env: \$(du -sh "\$env" | cut -f1)"
          ffmpeg -loglevel error -f lavfi -i "aevalsrc='0.3*(sin(2*PI*261.63*t)+sin(2*PI*329.63*t)+sin(2*PI*392*t))*exp(-6*mod(t,0.5))':s=44100:d=12" c.wav
          start=\$(date +%s)
          "\$env/bin/madsister-engine" transcribe c.wav --out c.madsister.json
          echo "transcribe: \$((\$(date +%s) - start)) s"
          grep -q '"chord": "C:maj"' c.madsister.json
          EOF

  # macOS arm64: an unsigned .dmg (ad-hoc signature only); the `homebrew` job below installs it through a cask that clears the quarantine flag.
  macos:
    needs: version
    if: needs.version.outputs.skip != 'true' && inputs.platforms != 'linux' && inputs.platforms != 'windows'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1 # no floating major tag upstream
        with:
          version: ${{ env.UV_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo install cargo-packager --locked --version "$PACKAGER_VERSION"
      - id: madmom
        run: echo "rev=$(sed -n 's/^madmom = .*rev = "\([0-9a-f]*\)".*/\1/p' engine/pyproject.toml)" >> "$GITHUB_OUTPUT"
      - id: madmom-wheel
        uses: actions/cache@v6
        with:
          path: engine/wheels
          key: madmom-wheel-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ steps.madmom.outputs.rev }}
      - name: Build the madmom wheel (first launch then needs no git nor C compiler)
        if: steps.madmom-wheel.outputs.cache-hit != 'true'
        env:
          rev: ${{ steps.madmom.outputs.rev }}
        run: |
          git clone --quiet https://github.com/CPJKU/madmom "$RUNNER_TEMP/madmom"
          git -C "$RUNNER_TEMP/madmom" checkout --quiet "$rev"
          git -C "$RUNNER_TEMP/madmom" submodule update --init --quiet # the model weights
          uv build --wheel --python 3.11 --out-dir engine/wheels "$RUNNER_TEMP/madmom"
      - name: Download the uv sidecar
        env:
          PACKAGE: ${{ needs.version.outputs.package }}
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p app/binaries
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-$triple.tar.gz" |
            tar -xzO "uv-$triple/uv" > "app/binaries/$PACKAGE-uv-$triple"
          chmod +x "app/binaries/$PACKAGE-uv-$triple"
      - name: Build the dmg
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE: ${{ needs.version.outputs.package }}
        # Same as on Linux; Cargo.toml asks for the ad-hoc signature Apple silicon requires to run the app.
        run: |
          perl -0pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/m' Cargo.toml
          cargo build --release
          [ "$PACKAGE" = madsister ] || cp target/release/madsister "target/release/$PACKAGE"
          cargo packager -c "$(uv run --no-project --python 3.11 release-config.py "$PACKAGE" "$VERSION")" -f dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          path: app/target/release/*.dmg

  # The macOS twin of linux-clean-install: the engine sets up from the installed .app and transcribes, with ffmpeg as the only prerequisite.
  macos-clean-install:
    needs: [version, macos]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # setup-engine.py, the script the app runs on first launch
      - uses: actions/download-artifact@v8
        with:
          name: macos
      - run: brew install ffmpeg
      - name: Set up the engine from the .app, then transcribe a synthetic C major clip
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE: ${{ needs.version.outputs.package }}
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" ./*.dmg
          app="$RUNNER_TEMP/dmg/$PACKAGE.app"
          env=$RUNNER_TEMP/engine-env
          start=$(date +%s)
          "$app/Contents/MacOS/$PACKAGE-uv" run --no-project --managed-python --python 3.11 python -I app/setup-engine.py "$app/Contents/MacOS/$PACKAGE-uv" "$app/Contents/Resources/engine" "$env" "$VERSION"
          echo "setup: $(($(date +%s) - start)) s, env: $(du -sh "$env" | cut -f1)"
          ffmpeg -loglevel error -f lavfi -i "aevalsrc='0.3*(sin(2*PI*261.63*t)+sin(2*PI*329.63*t)+sin(2*PI*392*t))*exp(-6*mod(t,0.5))':s=44100:d=12" c.wav
          start=$(date +%s)
          "$env/bin/madsister-engine" transcribe c.wav --out c.madsister.json
          echo "transcribe: $(($(date +%s) - start)) s"
          grep -q '"chord": "C:maj"' c.madsister.json

  # Windows x64: an unsigned per-user NSIS installer (SmartScreen warns once), with ffmpeg as a second sidecar since no
  # package manager brings it; the app puts its own folder first on the engine's PATH.
  windows:
    needs: version
    if: needs.version.outputs.skip != 'true' && inputs.platforms != 'linux' && inputs.platforms != 'macos'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1 # no floating major tag upstream
        with:
          version: ${{ env.UV_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo install cargo-packager --locked --version "$PACKAGER_VERSION"
      - id: madmom
        run: echo "rev=$(sed -n 's/^madmom = .*rev = "\([0-9a-f]*\)".*/\1/p' engine/pyproject.toml)" >> "$GITHUB_OUTPUT"
      - id: madmom-wheel
        uses: actions/cache@v6
        with:
          path: engine/wheels
          key: madmom-wheel-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ steps.madmom.outputs.rev }}
      - name: Build the madmom wheel (first launch then needs no git nor C compiler)
        if: steps.madmom-wheel.outputs.cache-hit != 'true'
        env:
          rev: ${{ steps.madmom.outputs.rev }}
        run: |
          git clone --quiet https://github.com/CPJKU/madmom "$RUNNER_TEMP/madmom"
          git -C "$RUNNER_TEMP/madmom" checkout --quiet "$rev"
          git -C "$RUNNER_TEMP/madmom" submodule update --init --quiet # the model weights
          uv build --wheel --python 3.11 --out-dir engine/wheels "$RUNNER_TEMP/madmom"
      - name: Download the uv and ffmpeg sidecars
        env:
          PACKAGE: ${{ needs.version.outputs.package }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # ffmpeg ships to users inside the installer: a dated BtbN build, checked against the sha256 recorded here.
        # BtbN prunes old builds, so the first run with a pin copies it to this repo's `ffmpeg` prerelease, read from then on.
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p app/binaries
          curl -fsSLo "$RUNNER_TEMP/uv.zip" "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-$triple.zip"
          unzip -p "$RUNNER_TEMP/uv.zip" uv.exe > "app/binaries/$PACKAGE-uv-$triple.exe"
          asset=${FFMPEG_BUILD#*/} # BtbN's file name, unique per build
          if ! gh release download ffmpeg -p "$asset" -D "$RUNNER_TEMP" 2>/dev/null; then
            curl -fsSLo "$RUNNER_TEMP/$asset" "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_BUILD"
            echo "$FFMPEG_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
            gh release view ffmpeg >/dev/null 2>&1 ||
              gh release create ffmpeg --prerelease --title "ffmpeg mirror" --notes "Build dependencies mirrored for the release workflow, not a madsister release."
            gh release upload ffmpeg "$RUNNER_TEMP/$asset" --clobber
          fi
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/$asset" '*/bin/ffmpeg.exe' > "app/binaries/ffmpeg-$triple.exe"
      - name: Build the installer
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE: ${{ needs.version.outputs.package }}
        # Same as on Linux, plus the ffmpeg sidecar. NSIS's default install mode is per user, into %LOCALAPPDATA%\<product>.
        run: |
          perl -0pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/m' Cargo.toml
          cargo build --release
          [ "$PACKAGE" = madsister ] || cp target/release/madsister.exe "target/release/$PACKAGE.exe"
          cargo packager -c "$(uv run --no-project --python 3.11 release-config.py "$PACKAGE" "$VERSION" binaries/ffmpeg)" -f nsis
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          path: app/target/release/*-setup.exe

  # The Windows twin of linux-clean-install: the installer's engine sets up and transcribes with the bundled ffmpeg only.
  windows-clean-install:
    needs: [version, windows]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7 # setup-engine.py, the script the app runs on first launch
      - uses: actions/download-artifact@v8
        with:
          name: windows
      - name: Install, set up the engine, then transcribe a synthetic C major clip
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE: ${{ needs.version.outputs.package }}
        run: |
          ./*-setup.exe //S # silent, per user: into %LOCALAPPDATA%\<product>
          app=$LOCALAPPDATA/$PACKAGE
          ls "$app"
          export PATH="$(cygpath -u "$app"):$PATH" # as the app does for the engine: the bundled ffmpeg (cygpath: C: would split PATH)
          env=$LOCALAPPDATA/dev.dericbourg.$PACKAGE/engine-env
          start=$(date +%s)
          "$app/$PACKAGE-uv.exe" run --no-project --managed-python --python 3.11 python -I app/setup-engine.py "$app/$PACKAGE-uv.exe" "$app/engine" "$env" "$VERSION"
          echo "setup: $(($(date +%s) - start)) s, env: $(du -sh "$env" | cut -f1)"
          ffmpeg -loglevel error -f lavfi -i "aevalsrc='0.3*(sin(2*PI*261.63*t)+sin(2*PI*329.63*t)+sin(2*PI*392*t))*exp(-6*mod(t,0.5))':s=44100:d=12" c.wav
          start=$(date +%s)
          "$env/Scripts/madsister-engine.exe" transcribe c.wav --out c.madsister.json
          echo "transcribe: $(($(date +%s) - start)) s"
          grep -q '"chord": "C:maj"' c.madsister.json

  publish:
    needs: [version, linux, linux-clean-install, macos, macos-clean-install, windows, windows-clean-install]
    # A platform left out of a manual run skips its jobs, which would skip this one too.
    if: ${{ !cancelled() && !failure() && needs.version.outputs.skip != 'true' }}
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE: ${{ needs.version.outputs.package }}
      PLATFORMS: ${{ inputs.platforms }}
      RELEASE: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          shopt -s nullglob # a platform left out has no files
          notes="For non-commercial use only: the engine includes madmom's CC BY-NC-SA 4.0 model weights (see THIRD_PARTY.md)."
          if [ "$PLATFORMS" != macos ] && [ "$PLATFORMS" != windows ]; then
            notes="$notes
          Linux: \`sudo apt install ./${PACKAGE}_${VERSION}_amd64.deb\`, or the AppImage (it needs ffmpeg and libportaudio2).
          To get updates through apt (the package \`madsister\` follows the releases, \`madsister-snapshot\` the snapshots; they can be installed together):
          \`\`\`
          sudo curl -fsSLo /etc/apt/keyrings/madsister.asc https://www.dericbourg.net/madsister/key.asc
          printf 'Types: deb\nURIs: https://www.dericbourg.net/madsister\nSuites: stable\nComponents: main\nSigned-By: /etc/apt/keyrings/madsister.asc\n' | sudo tee /etc/apt/sources.list.d/madsister.sources
          sudo apt update && sudo apt install $PACKAGE
          \`\`\`"
          fi
          if [ "$PLATFORMS" != linux ] && [ "$PLATFORMS" != windows ]; then
            notes="$notes
          macOS (Apple silicon): \`brew install --cask adericbourg/tap/$PACKAGE\` (it installs ffmpeg), or the dmg: the app is unsigned, run \`xattr -dr com.apple.quarantine /Applications/$PACKAGE.app\` once after copying it (it needs ffmpeg)."
          fi
          if [ "$PLATFORMS" != linux ] && [ "$PLATFORMS" != macos ]; then
            notes="$notes
          Windows (x64): run \`${PACKAGE}_${VERSION}_x64-setup.exe\` (no admin rights needed; ffmpeg included). It's unsigned: on SmartScreen's warning, click *More info*, then *Run anyway*."
          fi
          notes="$notes
          The first launch downloads the engine (Python, its libraries and the models), once."
          if [ "$RELEASE" = true ]; then
            # Creates the tag on this commit (a tag pushed with the workflow's token wouldn't trigger anything anyway).
            gh release create "v$VERSION" dist/*.deb dist/*.AppImage dist/*.dmg dist/*.exe --target "$GITHUB_SHA" --title "madsister $VERSION" --notes "$notes"
          else
            tag=v$VERSION
            gh release create "$tag" dist/*.deb dist/*.AppImage dist/*.dmg dist/*.exe --prerelease --target "$GITHUB_SHA" --title "madsister $VERSION" --notes "$notes"
            # Only the latest snapshot is kept: the previous ones go once this one is published.
            gh release list --limit 100 --json tagName --jq '.[].tagName | select(contains("-snapshot."))' |
              while read -r old; do
                if [ "$old" != "$tag" ]; then gh release delete "$old" --cleanup-tag --yes; fi
              done
          fi

  # Rebuilds the whole site each time (a Pages deployment replaces it): the latest release and the latest snapshot, so no deb enters git.
  apt:
    needs: publish
    # The implicit success() is false when any ancestor (here the macos jobs of a linux-only run) was skipped.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false # a deployment is never cancelled midway
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Build the repository
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils  # apt-ftparchive; not on the ubuntu-slim image
          gpg --batch --import <<< "$GPG_KEY"
          mkdir -p site/pool site/dists/stable/main/binary-amd64 && cd site
          # The latest release with a deb: a macOS-only one has none.
          release=$(gh api "repos/$GH_REPO/releases" --jq '[.[] | select(.prerelease | not) | select(any(.assets[]; .name | endswith(".deb")))][0].tag_name // empty')
          snapshot=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(contains("-snapshot."))][0] // empty')
          for tag in $release $snapshot; do gh release download "$tag" --pattern '*.deb' --dir pool; done
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          apt-ftparchive -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Components=main -o APT::FTPArchive::Release::Architectures=amd64 \
            release dists/stable > dists/stable/Release
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --export --armor > key.asc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  # Writes the cask (`madsister` for a release, `madsister-snapshot` for a snapshot) into the tap, pointing at the dmg just published.
  # GITHUB_TOKEN can't write to another repository: HOMEBREW_TAP_TOKEN is a fine-grained PAT with contents:write on the tap only.
  homebrew:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && inputs.platforms != 'linux' && inputs.platforms != 'windows' }} # no dmg to point the cask at; see `apt`
    runs-on: ubuntu-slim
    concurrency:
      group: homebrew
      cancel-in-progress: false # two runs in a row would otherwise race on the push
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE: ${{ needs.version.outputs.package }}
    steps:
      - name: Update the cask
        run: |
          gh release download "v$VERSION" --pattern '*.dmg' --dir .
          sha=$(sha256sum ./*.dmg | cut -d' ' -f1)
          git clone --quiet "https://x-access-token:$TAP_TOKEN@github.com/adericbourg/homebrew-tap" tap
          cd tap
          mkdir -p Casks
          cat > "Casks/$PACKAGE.rb" <<RUBY
          # This file is generated by madsister's release workflow. DO NOT EDIT.
          cask "$PACKAGE" do
            version "$VERSION"
            sha256 "$sha"

            url "https://github.com/$GH_REPO/releases/download/v#{version}/${PACKAGE}_#{version}_aarch64.dmg"
            name "$PACKAGE"
            desc "Turns a song into an editable, printable chord grid"
            homepage "https://github.com/$GH_REPO"

            livecheck do
              skip "Auto-generated on release."
            end

            depends_on arch: :arm64
            depends_on formula: "ffmpeg"

            app "$PACKAGE.app"

            # Not signed nor notarized: without this Gatekeeper blocks the app.
            postflight do
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{appdir}/$PACKAGE.app"]
            end

            zap trash: "~/Library/Application Support/dev.dericbourg.$PACKAGE"
          end
          RUBY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/$PACKAGE.rb"
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Brew cask update for $PACKAGE version v$VERSION"
          git pull --rebase --quiet && git push --quiet
