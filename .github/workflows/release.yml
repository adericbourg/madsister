name: release

# Every push to main publishes a snapshot pre-release `v<last tag or 0.0.0>-snapshot.<run number>` (only the latest is kept);
# running it by hand (Actions > release > Run workflow, on main) with a patch/minor/major bump publishes the release
# `vX.Y.Z` that is kept; the tag is created by the publication itself. It doesn't wait for the `app`/`engine` workflows: the clean-install
# check below gates the publication, and a later push replaces a bad snapshot.
# A release is the package `madsister`, a snapshot the package `madsister-snapshot` (own binary, files and data dir: both
# can be installed together). The `apt` job then republishes the signed apt repository on GitHub Pages: its only suite
# holds the latest of each, and the `homebrew` job commits the matching macOS cask to adericbourg/homebrew-tap.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }} # a newer snapshot supersedes this one, a release is never cancelled

env:
  UV_VERSION: 0.12.21 # the uv bundled as the app's sidecar, also used to build the madmom wheel

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          package=madsister-snapshot
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            package=madsister
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::releases are made from main, not $GITHUB_REF"
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) version=$((major + 1)).0.0 ;;
              minor) version=$major.$((minor + 1)).0 ;;
              patch) version=$major.$minor.$((patch + 1)) ;;
            esac
          else
            version=${last#v}-snapshot.$GITHUB_RUN_NUMBER
          fi
          if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-snapshot\.[0-9]+)?$'; then
            echo "::error::not a semver version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

  # One job per platform, each uploading its artifact (`linux`, `macos`) to `publish`.
  linux:
    needs: version
    runs-on: ubuntu-22.04 # the oldest glibc the deb and the AppImage then run on
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag upstream
        with:
          version: ${{ env.UV_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # Tauri's packages (https://v2.tauri.app/start/prerequisites/#linux), patchelf for the AppImage, and the GStreamer
      # plugins the AppImage bundles (bundleMediaFramework).
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - uses: actions/cache@v6 # the AppImage tools (linuxdeploy, AppRun, its plugins) tauri downloads otherwise
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - id: madmom
        run: echo "rev=$(sed -n 's/^madmom = .*rev = "\([0-9a-f]*\)".*/\1/p' engine/pyproject.toml)" >> "$GITHUB_OUTPUT"
      - id: madmom-wheel
        uses: actions/cache@v6
        with:
          path: engine/wheels
          key: madmom-wheel-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ steps.madmom.outputs.rev }}
      - name: Build the madmom wheel (first launch then needs no git nor C compiler)
        if: steps.madmom-wheel.outputs.cache-hit != 'true'
        env:
          rev: ${{ steps.madmom.outputs.rev }}
        run: |
          git clone --quiet https://github.com/CPJKU/madmom "$RUNNER_TEMP/madmom"
          git -C "$RUNNER_TEMP/madmom" checkout --quiet "$rev"
          git -C "$RUNNER_TEMP/madmom" submodule update --init --quiet # the model weights
          uv build --wheel --python 3.11 --out-dir engine/wheels "$RUNNER_TEMP/madmom"
      - name: Download the uv sidecar
        env:
          PACKAGE: ${{ needs.version.outputs.package }}
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p app/src-tauri/binaries
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-$triple.tar.gz" |
            tar -xzO "uv-$triple/uv" > "app/src-tauri/binaries/$PACKAGE-uv-$triple"
          chmod +x "app/src-tauri/binaries/$PACKAGE-uv-$triple"
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Build the deb and the AppImage
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE: ${{ needs.version.outputs.package }}
        # The package name is the product name (deb, binary, resources, desktop file), the identifier names the data dir.
        run: >-
          pnpm tauri build --bundles deb,appimage --config src-tauri/tauri.bundle.conf.json
          --config "{\"productName\":\"$PACKAGE\",\"mainBinaryName\":\"$PACKAGE\",\"identifier\":\"dev.dericbourg.$PACKAGE\",\"version\":\"$VERSION\",\"bundle\":{\"externalBin\":[\"binaries/$PACKAGE-uv\"],\"resources\":{\"../../engine/wheels/\":\"engine/wheels/\"}}}"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage

  # M6 "done when" on Linux: the deb installs on a clean system and its engine sets up and transcribes, with no compiler.
  linux-clean-install:
    needs: [version, linux]
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # setup-engine.sh, the script the app runs on first launch
      - uses: actions/download-artifact@v8
        with:
          name: linux
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./deb/*.deb
      - name: Set up the engine as a user, then transcribe a synthetic C major clip
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE: ${{ needs.version.outputs.package }}
        run: |
          useradd --create-home user
          cp app/src-tauri/setup-engine.sh /tmp/ # readable by the user
          project=$(dirname "$(dpkg -L "$PACKAGE" | grep '/engine/pyproject.toml$')")
          su user -c "sh -eu" <<EOF
          cd
          env=\$HOME/.local/share/dev.dericbourg.$PACKAGE/engine-env
          start=\$(date +%s)
          sh /tmp/setup-engine.sh /usr/bin/$PACKAGE-uv $project "\$env" $VERSION
          echo "setup: \$((\$(date +%s) - start)) s, env: \$(du -sh "\$env" | cut -f1)"
          ffmpeg -loglevel error -f lavfi -i "aevalsrc='0.3*(sin(2*PI*261.63*t)+sin(2*PI*329.63*t)+sin(2*PI*392*t))*exp(-6*mod(t,0.5))':s=44100:d=12" c.wav
          start=\$(date +%s)
          "\$env/bin/madsister-engine" transcribe c.wav --out c.madsister.json
          echo "transcribe: \$((\$(date +%s) - start)) s"
          grep -q '"chord": "C:maj"' c.madsister.json
          EOF

  # macOS arm64: an unsigned .dmg (ad-hoc signature only); the `homebrew` job below installs it through a cask that clears the quarantine flag.
  macos:
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag upstream
        with:
          version: ${{ env.UV_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - id: madmom
        run: echo "rev=$(sed -n 's/^madmom = .*rev = "\([0-9a-f]*\)".*/\1/p' engine/pyproject.toml)" >> "$GITHUB_OUTPUT"
      - id: madmom-wheel
        uses: actions/cache@v6
        with:
          path: engine/wheels
          key: madmom-wheel-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ steps.madmom.outputs.rev }}
      - name: Build the madmom wheel (first launch then needs no git nor C compiler)
        if: steps.madmom-wheel.outputs.cache-hit != 'true'
        env:
          rev: ${{ steps.madmom.outputs.rev }}
        run: |
          git clone --quiet https://github.com/CPJKU/madmom "$RUNNER_TEMP/madmom"
          git -C "$RUNNER_TEMP/madmom" checkout --quiet "$rev"
          git -C "$RUNNER_TEMP/madmom" submodule update --init --quiet # the model weights
          uv build --wheel --python 3.11 --out-dir engine/wheels "$RUNNER_TEMP/madmom"
      - name: Download the uv sidecar
        env:
          PACKAGE: ${{ needs.version.outputs.package }}
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p app/src-tauri/binaries
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-$triple.tar.gz" |
            tar -xzO "uv-$triple/uv" > "app/src-tauri/binaries/$PACKAGE-uv-$triple"
          chmod +x "app/src-tauri/binaries/$PACKAGE-uv-$triple"
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Build the dmg
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE: ${{ needs.version.outputs.package }}
        # Same overrides as on Linux; signingIdentity "-" is the ad-hoc signature Apple silicon requires to run the app.
        run: >-
          pnpm tauri build --bundles dmg --config src-tauri/tauri.bundle.conf.json
          --config "{\"productName\":\"$PACKAGE\",\"mainBinaryName\":\"$PACKAGE\",\"identifier\":\"dev.dericbourg.$PACKAGE\",\"version\":\"$VERSION\",\"bundle\":{\"externalBin\":[\"binaries/$PACKAGE-uv\"],\"resources\":{\"../../engine/wheels/\":\"engine/wheels/\"},\"macOS\":{\"signingIdentity\":\"-\"}}}"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          path: app/src-tauri/target/release/bundle/dmg/*.dmg

  # The macOS twin of linux-clean-install: the engine sets up from the installed .app and transcribes, with ffmpeg as the only prerequisite.
  macos-clean-install:
    needs: [version, macos]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # setup-engine.sh, the script the app runs on first launch
      - uses: actions/download-artifact@v8
        with:
          name: macos
      - run: brew install ffmpeg
      - name: Set up the engine from the .app, then transcribe a synthetic C major clip
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE: ${{ needs.version.outputs.package }}
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" ./*.dmg
          app="$RUNNER_TEMP/dmg/$PACKAGE.app"
          env=$RUNNER_TEMP/engine-env
          start=$(date +%s)
          sh app/src-tauri/setup-engine.sh "$app/Contents/MacOS/$PACKAGE-uv" "$app/Contents/Resources/engine" "$env" "$VERSION"
          echo "setup: $(($(date +%s) - start)) s, env: $(du -sh "$env" | cut -f1)"
          ffmpeg -loglevel error -f lavfi -i "aevalsrc='0.3*(sin(2*PI*261.63*t)+sin(2*PI*329.63*t)+sin(2*PI*392*t))*exp(-6*mod(t,0.5))':s=44100:d=12" c.wav
          start=$(date +%s)
          "$env/bin/madsister-engine" transcribe c.wav --out c.madsister.json
          echo "transcribe: $(($(date +%s) - start)) s"
          grep -q '"chord": "C:maj"' c.madsister.json

  publish:
    needs: [version, linux, linux-clean-install, macos, macos-clean-install]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE: ${{ needs.version.outputs.package }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          notes="For non-commercial use only: the engine includes madmom's CC BY-NC-SA 4.0 model weights (see THIRD_PARTY.md).
          Linux: \`sudo apt install ./${PACKAGE}_${VERSION}_amd64.deb\`, or the AppImage (it needs ffmpeg and libportaudio2).
          macOS (Apple silicon): \`brew install --cask adericbourg/tap/$PACKAGE\` (it installs ffmpeg), or the dmg: the app is unsigned, run \`xattr -dr com.apple.quarantine /Applications/$PACKAGE.app\` once after copying it (it needs ffmpeg).
          To get updates through apt (the package \`madsister\` follows the releases, \`madsister-snapshot\` the snapshots; they can be installed together):
          \`\`\`
          sudo curl -fsSLo /etc/apt/keyrings/madsister.asc https://www.dericbourg.net/madsister/key.asc
          printf 'Types: deb\nURIs: https://www.dericbourg.net/madsister\nSuites: stable\nComponents: main\nSigned-By: /etc/apt/keyrings/madsister.asc\n' | sudo tee /etc/apt/sources.list.d/madsister.sources
          sudo apt update && sudo apt install $PACKAGE
          \`\`\`
          The first launch downloads the engine (Python, its libraries and the models), once."
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Creates the tag on this commit (a tag pushed with the workflow's token wouldn't trigger anything anyway).
            gh release create "v$VERSION" dist/*/* dist/*.dmg --target "$GITHUB_SHA" --title "madsister $VERSION" --notes "$notes"
          else
            tag=v$VERSION
            gh release create "$tag" dist/*/* dist/*.dmg --prerelease --target "$GITHUB_SHA" --title "madsister $VERSION" --notes "$notes"
            # Only the latest snapshot is kept: the previous ones go once this one is published.
            gh release list --limit 100 --json tagName --jq '.[].tagName | select(contains("-snapshot."))' |
              while read -r old; do
                if [ "$old" != "$tag" ]; then gh release delete "$old" --cleanup-tag --yes; fi
              done
          fi

  # Rebuilds the whole site each time (a Pages deployment replaces it): the latest release and the latest snapshot, so no deb enters git.
  apt:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false # a deployment is never cancelled midway
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Build the repository
        run: |
          gpg --batch --import <<< "$GPG_KEY"
          mkdir -p site/pool site/dists/stable/main/binary-amd64 && cd site
          release=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          snapshot=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(contains("-snapshot."))][0] // empty')
          for tag in $release $snapshot; do gh release download "$tag" --pattern '*.deb' --dir pool; done
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          apt-ftparchive -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Components=main -o APT::FTPArchive::Release::Architectures=amd64 \
            release dists/stable > dists/stable/Release
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --export --armor > key.asc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  # Writes the cask (`madsister` for a release, `madsister-snapshot` for a snapshot) into the tap, pointing at the dmg just published.
  # GITHUB_TOKEN can't write to another repository: HOMEBREW_TAP_TOKEN is a fine-grained PAT with contents:write on the tap only.
  homebrew:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    concurrency:
      group: homebrew
      cancel-in-progress: false # two runs in a row would otherwise race on the push
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE: ${{ needs.version.outputs.package }}
    steps:
      - name: Update the cask
        run: |
          gh release download "v$VERSION" --pattern '*.dmg' --dir .
          sha=$(sha256sum ./*.dmg | cut -d' ' -f1)
          git clone --quiet "https://x-access-token:$TAP_TOKEN@github.com/adericbourg/homebrew-tap" tap
          cd tap
          mkdir -p Casks
          cat > "Casks/$PACKAGE.rb" <<RUBY
          # This file is generated by madsister's release workflow. DO NOT EDIT.
          cask "$PACKAGE" do
            version "$VERSION"
            sha256 "$sha"

            url "https://github.com/$GH_REPO/releases/download/v#{version}/${PACKAGE}_#{version}_aarch64.dmg"
            name "$PACKAGE"
            desc "Turns a song into an editable, printable chord grid"
            homepage "https://github.com/$GH_REPO"

            livecheck do
              skip "Auto-generated on release."
            end

            depends_on arch: :arm64
            depends_on formula: "ffmpeg"

            app "$PACKAGE.app"

            # Not signed nor notarized: without this Gatekeeper blocks the app.
            postflight do
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{appdir}/$PACKAGE.app"]
            end

            zap trash: "~/Library/Application Support/dev.dericbourg.$PACKAGE"
          end
          RUBY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/$PACKAGE.rb"
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Brew cask update for $PACKAGE version v$VERSION"
          git pull --rebase --quiet && git push --quiet
