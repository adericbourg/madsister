name: app-native

on:
  push:
    branches: [main]
    paths: ["app-native/**", ".github/workflows/app-native.yml"]
  pull_request:
    paths: ["app-native/**", ".github/workflows/app-native.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # apt mirrors occasionally hang
    defaults:
      run:
        working-directory: app-native
    steps:
      - uses: actions/checkout@v7
      # Slint's winit backend on Linux: fonts and keyboard layouts
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-native
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
