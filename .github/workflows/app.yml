name: app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  schedule:
    - cron: "0 2 * * *"  # Windows runners bill 2x Linux: the Windows check runs nightly, not per push
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule' # the push or PR already ran it
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # apt mirrors occasionally hang
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # Slint's winit backend on Linux: fonts and keyboard layouts; cpal: ALSA; the audio tests decode with ffmpeg
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libasound2-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  changed:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    outputs:
      app: ${{ steps.changed.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history the path filter looks at
      - id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -n "$(git log --since='25 hours ago' -1 --format=%H -- app .github/workflows/app.yml)" ]; then
            echo app=true >> "$GITHUB_OUTPUT"
          fi

  # The Windows-only code (process tree, console window, PATH): compiled and linted on Windows, the unix tests skipped.
  # Nightly, and only if app/ changed in the last 25 hours; run the workflow by hand to check a risky PR.
  windows:
    needs: changed
    if: needs.changed.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - run: choco install ffmpeg --no-progress -y # the audio tests decode with ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
