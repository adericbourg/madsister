name: app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  schedule:
    - cron: "0 2 * * *"  # Windows runners bill 2x Linux: the Windows check runs nightly, not per push
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule' # the push or PR already ran it
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # apt mirrors occasionally hang
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # https://v2.tauri.app/start/prerequisites/#linux (build-essential, curl, wget, file are on the runner)
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo check --locked
        working-directory: app/src-tauri
      - run: cargo clippy --locked -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test --locked
        working-directory: app/src-tauri

  changed:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    outputs:
      app: ${{ steps.changed.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history the path filter looks at
      - id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -n "$(git log --since='25 hours ago' -1 --format=%H -- app .github/workflows/app.yml)" ]; then
            echo app=true >> "$GITHUB_OUTPUT"
          fi

  # The Windows-only code (process tree, console window, PATH): compiled and linted on Windows, the unix tests skipped.
  # Nightly, and only if app/ changed in the last 25 hours; run the workflow by hand to check a risky PR.
  windows:
    needs: changed
    if: needs.changed.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # tauri's build script embeds the frontend
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test --locked
        working-directory: app/src-tauri
