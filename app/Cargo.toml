[package]
name = "madsister"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

description = "Turns a song into an editable, printable chord grid"
homepage = "https://github.com/adericbourg/madsister"

# `cargo packager --release` (README, Packaging). The release workflow overrides the names for the snapshot package and
# adds the madmom wheel; whatever is named after the binary must stay so (`Packaged::beside`).
[package.metadata.packager]
product-name = "madsister"
identifier = "dev.dericbourg.madsister"
before-packaging-command = "cargo build --release"
authors = ["Alban Dericbourg"] # the deb's Maintainer
icons = ["icons/32x32.png", "icons/128x128.png", "icons/icon.png", "icons/icon.icns", "icons/icon.ico"]
category = "Music"
external-binaries = ["binaries/madsister-uv"]
resources = [
  { src = "../engine/pyproject.toml", target = "engine/pyproject.toml" },
  { src = "../engine/uv.lock", target = "engine/uv.lock" },
  { src = "../engine/.python-version", target = "engine/.python-version" },
  { src = "../engine/madsister_engine", target = "engine/madsister_engine" },
]

[package.metadata.packager.macos]
signing-identity = "-" # ad hoc, which Apple silicon requires to run the app: it isn't signed nor notarized
info-plist-path = "Info.plist" # merged into the generated one: the microphone prompt's text (recording)

[package.metadata.packager.deb]
# ffmpeg: the engine's and the player's decoder; libportaudio2: the engine's recording (sounddevice); libasound2: cpal's
# ALSA output (PipeWire and PulseAudio serve it too); libfontconfig1: linked. The others are loaded at run time: winit's
# X11 and Wayland, Slint's OpenGL renderer, and the file dialogs' D-Bus (rfd's xdg-desktop-portal backend).
depends = [
  "ca-certificates", "ffmpeg", "libportaudio2", "libasound2t64 | libasound2", "libfontconfig1",
  "libx11-xcb1", "libxcursor1", "libxi6", "libxrender1", "libxkbcommon-x11-0", "libwayland-client0", "libwayland-egl1",
  "libegl1", "libgl1", "libdbus-1-3",
]

[dependencies]
cpal = "0.18"
dirs = "6"
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"] }
opener = { version = "0.9", features = ["reveal"] }
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11"
skrifa = "0.42.1"
slint = { version = "1.18", features = ["unstable-winit-030"] }

[build-dependencies]
slint-build = "1.18"

# Line tables keep backtraces readable; full debug info for Slint's generated code filled the disk (16 GB target).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
