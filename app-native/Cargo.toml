[package]
name = "madsister"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
slint = { version = "1.18", features = ["unstable-winit-030"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
