[package]
name = "madsister"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
dirs = "6"
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
skrifa = "0.42.1"
slint = { version = "1.18", features = ["unstable-winit-030"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
