[project]
name = "madsister-engine"
version = "0.1.0"
description = "madsister transcription engine: audio in, chord grid (Song JSON) out"
authors = [
    { name = "Alban Dericbourg", email = "alban@dericbourg.dev" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.6",
]

[project.scripts]
madsister-engine = "madsister_engine.cli:main"

[dependency-groups]
beats-allinone = [
    "allin1",
    "madmom",
    "natten==0.17.4",  # last release with the legacy ops allin1 1.1.0 calls (allin1 only requires it on macOS)
    "torch==2.5.1",
    "torchaudio==2.5.1",
]
chords-btc = [
    "librosa",
    "mir-eval",  # imported by BTC's feature code
    "pyyaml",
    "torch==2.5.1",  # same pin as beats-allinone (one lockfile)
]
chords-cnnlstm = [
    "h5py",  # the imports below are pulled in by upstream's `mir` package, not used for inference
    "joblib",
    "librosa",
    "pretty-midi",
    "pydub",
    "torch==2.5.1",  # same pin as beats-allinone (one lockfile)
]
beats-madmom = [
    "madmom",
]
separate = [
    "demucs",
    "torch==2.5.1",  # same pin as beats-allinone (one lockfile)
]
fetch = ["yt-dlp"]
record = ["sounddevice"]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.extra-build-dependencies]
natten = ["torch==2.5.1", "cmake", "setuptools"]

[tool.uv.extra-build-variables]
natten = { CXXFLAGS = "-Wno-invalid-specialization" }  # torch 2.5 headers vs recent clang

[tool.uv.sources]
madmom = { git = "https://github.com/CPJKU/madmom", rev = "27f032e8947204902c675e5e341a3faf5dc86dae" }
# PyPI's Linux torch is the CUDA build (~2.5 GB with its nvidia-* deps): CPU-only on Linux, PyPI on macOS.
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../bench"]  # bench scripts are not part of the package
markers = ["slow: needs model weights or real audio processing (not run in CI)"]
